<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Гача: Кристальный алтарь</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#15121f;--panel:#201b30;--line:#352d4d;--text:#ece8f7;--mute:#9a92b5;--btn:#6d4cff;--btnt:#fff;
--c0:#9aa0ad;--c1:#5fd068;--c2:#4a9dff;--c3:#b25cff;--c4:#ffb02e;--c5:#ff4f6d;--c6:#1ee3cf;--c7:#ffe98a}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1eefb;--panel:#fff;--line:#d9d2ee;--text:#231c3a;--mute:#6c6488}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 "Trebuchet MS","Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font:700 26px/1.1 Georgia,"Times New Roman",serif;margin:4px 0 14px;letter-spacing:.5px}
.top{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stat{flex:1;min-width:120px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.stat small{color:var(--mute);display:block}.stat b{font-size:20px}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center}
#card{min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;transition:box-shadow .3s}
#card .em{font-size:56px;line-height:1}#card .nm{font-weight:700;font-size:20px;margin-top:6px}#card .rr{font-size:14px}
#card.pop{animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(.7);opacity:.3}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){#card.pop{animation:none}}
.row{display:flex;gap:10px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 14px;background:var(--btn);color:var(--btnt);cursor:pointer;flex:1}
button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible{outline:3px solid var(--c4);outline-offset:2px}
button.alt{background:transparent;color:var(--text);border:1px solid var(--line)}
h2{font-size:17px;margin:22px 0 8px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mute);font-weight:400}
td:nth-child(n+2),th:nth-child(n+2){text-align:right}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.it{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:14px}
.it.off{opacity:.35}.it .e{font-size:24px}
#log{max-height:120px;overflow:auto;font-size:14px;color:var(--mute);margin-top:10px;text-align:left}
#log div{padding:1px 0}
</style>
</head>
<body>
<main>
<h1>Кристальный алтарь</h1>
<div class="top">
  <div class="stat"><small>Монеты</small><b id="coins">0</b></div>
  <div class="stat"><small>Удача</small><b id="lucklv">0</b></div>
  <div class="stat"><small>Броски</small><b id="rolls">0</b></div>
  <div class="stat" style="flex-basis:100%"><small>Лучшая редкость (рекорд)</small><b id="best">—</b></div>
</div>

<div class="stage">
  <div id="card"><div class="em">🔮</div><div class="nm">Сделай первый бросок</div><div class="rr" style="color:var(--mute)">+1 монета каждую секунду</div></div>
  <div class="row">
    <button id="r1">Бросок · 10</button>
    <button id="r10">×10 · 100</button>
  </div>
  <div class="row" style="margin-top:10px">
    <button class="alt" id="luck"></button>
  </div>
  <div id="log"></div>
</div>

<h2>Шансы (с учётом удачи)</h2>
<table id="odds"></table>

<h2>Коллекция <span id="colcount" style="color:var(--mute);font-weight:400"></span></h2>
<div class="grid" id="col"></div>
<div class="row" style="margin-top:18px"><button class="alt" id="reset">Сбросить прогресс</button><button class="alt" id="adm">Админ</button></div>
<div id="admp" class="stage" style="display:none;margin-top:12px;text-align:left">
  <b>Админ-панель</b>
  <div class="row" style="margin-top:10px"><input id="a_coins" type="number" value="1000" style="flex:1;min-width:0;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)"><button id="a_give">Выдать монеты</button></div>
  <div class="row" style="margin-top:10px"><input id="a_luck" type="number" value="10" style="flex:1;min-width:0;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)"><button id="a_setluck">Задать уровень удачи</button></div>
  <div class="row" style="margin-top:10px"><select id="a_rar" style="flex:1;min-width:0;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)"></select><button id="a_item">Выдать предмет</button></div>
  <div class="row" style="margin-top:10px"><button class="alt" id="a_all">Открыть всю коллекцию</button></div>
</div>
</main>

<script>
const R=[
 {n:"Common",ru:"Обычный",w:60,v:2,c:"var(--c0)",items:["🪨 Камень","🍂 Лист","🥄 Ложка","🧦 Носок"]},
 {n:"Uncommon",ru:"Необычный",w:25,v:4,c:"var(--c1)",items:["🍀 Клевер","🗝️ Ключ","🕯️ Свеча","🧪 Зелье"]},
 {n:"Rare",ru:"Редкий",w:10,v:10,c:"var(--c2)",items:["💎 Сапфир","🛡️ Щит","📜 Свиток","🦉 Сова"]},
 {n:"Epic",ru:"Эпический",w:3.5,v:30,c:"var(--c3)",items:["🔮 Шар судьбы","🗡️ Клинок теней","🦄 Единорог"]},
 {n:"Legendary",ru:"Легендарный",w:1,v:120,c:"var(--c4)",items:["👑 Корона королей","🐉 Дракон","⚡ Молния Зевса"]},
 {n:"Mythic",ru:"Мифический",w:.3,v:500,c:"var(--c5)",items:["🔥 Феникс","🌌 Осколок галактики","🐙 Кракен"]},
 {n:"Secret",ru:"Секретный",w:.08,v:2500,c:"var(--c6)",items:["🕳️ Чёрная дыра","🎭 Маска незнакомца","⌛ Забытое время"]},
 {n:"Divine",ru:"Божественный",w:.02,v:12500,c:"var(--c7)",items:["☀️ Сердце солнца","👁️ Око вселенной","✨ Первая звезда"]}
];
const ALL=[];R.forEach((r,i)=>r.items.forEach(t=>ALL.push({i,t})));
const $=id=>document.getElementById(id);
let S={coins:30,luck:0,rolls:0,found:{},best:-1};
const KEY="gacha-v1";
try{const s=localStorage.getItem(KEY);if(s)S=Object.assign(S,JSON.parse(s))}catch(e){}
if(S.best<0){ALL.forEach(a=>{if(S.found[a.t]&&a.i>S.best)S.best=a.i})}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e4?(n/1e3).toFixed(1)+"K":Math.floor(n).toString();
const luckCost=()=>Math.floor(50*Math.pow(1.55,S.luck));
const weights=()=>{const m=1+S.luck*.18;return R.map((r,i)=>r.w*Math.pow(m,i))};
function pick(){const w=weights(),t=w.reduce((a,b)=>a+b,0);let x=Math.random()*t;
 for(let i=0;i<w.length;i++){if((x-=w[i])<0)return i}return 0}
function roll(n){
 const cost=10*n;if(S.coins<cost)return;S.coins-=cost;
 let best=-1,bestItem=null,gain=0,lines=[];
 for(let k=0;k<n;k++){
  const i=pick(),its=R[i].items,t=its[Math.floor(Math.random()*its.length)];
  S.rolls++;S.found[t]=(S.found[t]||0)+1;gain+=R[i].v;
  if(i>best){best=i;bestItem=t}
  if(i>S.best)S.best=i;
  if(i>=3)lines.push(`<div style="color:${R[i].c}">${R[i].ru}: ${t}</div>`);
 }
 S.coins+=gain;
 const c=$("card"),[em,...nm]=bestItem.split(" ");
 c.innerHTML=`<div class="em">${em}</div><div class="nm">${nm.join(" ")}</div><div class="rr" style="color:${R[best].c}">${R[best].ru} · +${fmt(gain)} монет</div>`;
 c.style.borderColor=R[best].c;c.style.boxShadow=`0 0 ${10+best*8}px ${R[best].c}`;
 c.classList.remove("pop");void c.offsetWidth;c.classList.add("pop");
 if(lines.length){const l=$("log");l.innerHTML=lines.join("")+l.innerHTML;}
 render();save();
}
function render(){
 $("coins").textContent=fmt(S.coins);$("lucklv").textContent=S.luck;$("rolls").textContent=S.rolls;
 const b=$("best");if(S.best>=0){b.textContent=R[S.best].n+" · "+R[S.best].ru;b.style.color=R[S.best].c}else{b.textContent="—";b.style.color=""}
 $("r1").disabled=S.coins<10;$("r10").disabled=S.coins<100;
 const lc=luckCost();$("luck").textContent=`Прокачать удачу до ${S.luck+1} · ${fmt(lc)}`;$("luck").disabled=S.coins<lc;
 const w=weights(),t=w.reduce((a,b)=>a+b,0);
 $("odds").innerHTML="<tr><th>Редкость</th><th>Шанс</th><th>Награда</th></tr>"+R.map((r,i)=>{
  const p=w[i]/t*100;return `<tr><td style="color:${r.c};font-weight:700">${r.n}</td><td>${p>=1?p.toFixed(1):p.toFixed(p>=.1?2:3)}%</td><td>${fmt(r.v)}</td></tr>`}).join("");
 const got=ALL.filter(a=>S.found[a.t]).length;$("colcount").textContent=`${got}/${ALL.length}`;
 $("col").innerHTML=ALL.map(a=>{const n=S.found[a.t]||0,e=a.t.split(" ")[0];
  return `<div class="it ${n?"":"off"}" style="border-color:${n?R[a.i].c:"var(--line)"}"><div class="e">${n?e:"❔"}</div>${n?a.t.slice(e.length+1):"???"}<div style="color:${R[a.i].c};font-size:12px">${R[a.i].ru}${n?" ×"+n:""}</div></div>`}).join("");
}
$("r1").onclick=()=>roll(1);$("r10").onclick=()=>roll(10);
$("luck").onclick=()=>{const c=luckCost();if(S.coins>=c){S.coins-=c;S.luck++;render();save()}};
$("reset").onclick=()=>{if(confirm("Удалить весь прогресс?")){S={coins:30,luck:0,rolls:0,found:{},best:-1};$("log").innerHTML="";save();render()}};
const ADMIN_PASS="admin123";
$("a_rar").innerHTML=R.map((r,i)=>`<option value="${i}">${r.n}</option>`).join("");
$("adm").onclick=()=>{const p=$("admp");
 if(p.style.display!=="none"){p.style.display="none";return}
 if(prompt("Пароль админа")===ADMIN_PASS)p.style.display="block"};
$("a_give").onclick=()=>{S.coins+=Math.max(0,+$("a_coins").value||0);render();save()};
$("a_setluck").onclick=()=>{S.luck=Math.max(0,Math.floor(+$("a_luck").value||0));render();save()};
$("a_item").onclick=()=>{const i=+$("a_rar").value,its=R[i].items,t=its[Math.floor(Math.random()*its.length)];
 S.found[t]=(S.found[t]||0)+1;const [em,...nm]=t.split(" "),c=$("card");
 c.innerHTML=`<div class="em">${em}</div><div class="nm">${nm.join(" ")}</div><div class="rr" style="color:${R[i].c}">${R[i].ru} · выдано админом</div>`;
 c.style.borderColor=R[i].c;c.style.boxShadow=`0 0 ${10+i*8}px ${R[i].c}`;
 c.classList.remove("pop");void c.offsetWidth;c.classList.add("pop");render();save()};
$("a_all").onclick=()=>{ALL.forEach(a=>{if(!S.found[a.t])S.found[a.t]=1});render();save()};
setInterval(()=>{S.coins+=1;render();save()},1000);
render();
</script>
</body>
</html>
