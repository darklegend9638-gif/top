<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кристальный алтарь — Гача</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#0b0816;--bg2:#1b1040;--glass:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--text:#f1edff;--mute:#a69fc6;--btn1:#7b4dff;--btn2:#c04dff;--inp:#120d26;
--c0:#9aa0ad;--c1:#5fd068;--c2:#4a9dff;--c3:#b25cff;--c4:#ffb02e;--c5:#ff4f6d;--c6:#1ee3cf;--c7:#ffe98a}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3effd;--bg2:#d9ccff;--glass:rgba(255,255,255,.7);--line:rgba(60,30,120,.18);--text:#1d1536;--mute:#5d5480;--inp:#fff}}
:root[data-theme="dark"]{--bg:#0b0816;--bg2:#1b1040}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;color:var(--text);font:16px/1.45 "Trebuchet MS","Segoe UI",sans-serif;
background:radial-gradient(900px 500px at 15% -10%,var(--bg2),transparent 60%),radial-gradient(700px 500px at 100% 10%,#4a1566 0,transparent 55%),var(--bg);background-attachment:fixed}
main{max-width:660px;margin:0 auto;padding:18px 14px 40px}
h1{font:800 32px/1.05 Georgia,"Times New Roman",serif;text-align:center;margin:6px 0 4px;letter-spacing:1px;
background:linear-gradient(90deg,#ffe98a,#ff7ad9,#7bdcff,#ffe98a);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 8s linear infinite}
@keyframes flow{to{background-position:300% 0}}
.sub{text-align:center;color:var(--mute);margin:0 0 16px;font-size:14px}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.top{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{padding:10px 12px}.stat small{color:var(--mute);display:block;font-size:12px;text-transform:uppercase;letter-spacing:.8px}.stat b{font-size:21px}
.stat.wide{grid-column:1/-1}
.stage{padding:18px;text-align:center}
.orb{position:relative;width:190px;height:190px;margin:4px auto 14px;display:grid;place-items:center}
.ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,var(--rc,#7b4dff),transparent 30%,var(--rc,#7b4dff) 55%,transparent 80%,var(--rc,#7b4dff));filter:blur(.5px);animation:spin 6s linear infinite;
-webkit-mask:radial-gradient(circle,transparent 62%,#000 64%);mask:radial-gradient(circle,transparent 62%,#000 64%)}
.glow{position:absolute;inset:14px;border-radius:50%;box-shadow:0 0 50px var(--rc,#7b4dff),inset 0 0 40px color-mix(in srgb,var(--rc,#7b4dff) 40%,transparent);transition:box-shadow .4s}
.inner{position:relative;width:140px;height:140px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--rc,#7b4dff) 35%,#000),#0a0714 70%);border:1px solid var(--line);font-size:64px}
@keyframes spin{to{transform:rotate(360deg)}}
.orb.charge .ring{animation-duration:.5s}.orb.charge .inner{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px) rotate(-3deg)}40%{transform:translateX(5px) rotate(3deg)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.orb.reveal .inner{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
#nm{font:700 22px Georgia,serif;min-height:28px}#rr{font-size:14px;min-height:22px;letter-spacing:.5px}
.row{display:flex;gap:10px;margin-top:12px}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:14px;background:linear-gradient(135deg,var(--btn1),var(--btn2));color:#fff;cursor:pointer;flex:1;box-shadow:0 6px 18px rgba(123,77,255,.35);transition:transform .1s,filter .2s}
button:active:not(:disabled){transform:scale(.97)}button:hover:not(:disabled){filter:brightness(1.12)}
button:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}button:focus-visible{outline:3px solid var(--c4);outline-offset:2px}
button.alt{background:var(--glass);color:var(--text);border:1px solid var(--line);box-shadow:none}
h2{font-size:15px;text-transform:uppercase;letter-spacing:1.2px;color:var(--mute);margin:26px 4px 8px}
.odds{padding:6px 14px}
.od{display:grid;grid-template-columns:110px 1fr 84px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.od:last-child{border:0}.od .bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden}.od .bar i{display:block;height:100%;border-radius:4px}
.od span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.it{padding:10px;font-size:14px;border-radius:14px}.it.off{opacity:.3}.it .e{font-size:28px}
#log{max-height:110px;overflow:auto;font-size:14px;margin-top:12px;text-align:left}
#log div{padding:1px 0}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle,var(--fc,#fff),transparent 70%)}
#flash.go{animation:fl .9s ease-out}
@keyframes fl{0%{opacity:.7}100%{opacity:0}}
input,select{font:inherit;flex:1;min-width:0;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--inp);color:var(--text)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="flash"></div>
<main>
<h1>Кристальный алтарь</h1>
<p class="sub">Бросай, качай удачу, собери всё — вплоть до Divine</p>

<div class="top">
  <div class="glass stat"><small>Монеты</small><b id="coins">0</b></div>
  <div class="glass stat"><small>Удача</small><b id="lucklv">0</b></div>
  <div class="glass stat"><small>Броски</small><b id="rolls">0</b></div>
  <div class="glass stat wide"><small>Лучшая редкость (рекорд)</small><b id="best">—</b></div>
</div>

<div class="glass stage">
  <div class="orb" id="orb"><div class="ring"></div><div class="glow"></div><div class="inner" id="em">🔮</div></div>
  <div id="nm">Сделай первый бросок</div><div id="rr" style="color:var(--mute)">+3 монеты каждую секунду</div>
  <div class="row"><button id="r1">Бросок · 10</button><button id="r10">×10 · 100</button></div>
  <div class="row"><button class="alt" id="luck"></button></div>
  <div id="log"></div>
</div>

<h2>Шансы с учётом удачи</h2>
<div class="glass odds" id="odds"></div>

<h2>Коллекция <span id="colcount"></span></h2>
<div class="grid" id="col"></div>

<div class="row" style="margin-top:22px"><button class="alt" id="reset">Сбросить прогресс</button><button class="alt" id="adm">Админ</button></div>
<div id="admp" class="glass stage" style="display:none;margin-top:12px;text-align:left">
  <b>Админ-панель</b>
  <div class="row"><input id="a_coins" type="number" value="1000"><button id="a_give">Выдать монеты</button></div>
  <div class="row"><input id="a_luck" type="number" value="10"><button id="a_setluck">Уровень удачи</button></div>
  <div class="row"><select id="a_rar"></select><button id="a_item">Выдать предмет</button></div>
  <div class="row"><button class="alt" id="a_all">Открыть всю коллекцию</button></div>
</div>
</main>

<script>
const R=[
 {n:"Common",ru:"Обычный",w:70,v:2,c:"var(--c0)",items:["🪨 Камень","🍂 Лист","🥄 Ложка","🧦 Носок"]},
 {n:"Uncommon",ru:"Необычный",w:22,v:4,c:"var(--c1)",items:["🍀 Клевер","🗝️ Ключ","🕯️ Свеча","🧪 Зелье"]},
 {n:"Rare",ru:"Редкий",w:6.5,v:10,c:"var(--c2)",items:["💎 Сапфир","🛡️ Щит","📜 Свиток","🦉 Сова"]},
 {n:"Epic",ru:"Эпический",w:1.2,v:30,c:"var(--c3)",items:["🔮 Шар судьбы","🗡️ Клинок теней","🦄 Единорог"]},
 {n:"Legendary",ru:"Легендарный",w:.25,v:120,c:"var(--c4)",items:["👑 Корона королей","🐉 Дракон","⚡ Молния Зевса"]},
 {n:"Mythic",ru:"Мифический",w:.04,v:500,c:"var(--c5)",items:["🔥 Феникс","🌌 Осколок галактики","🐙 Кракен"]},
 {n:"Secret",ru:"Секретный",w:.006,v:2500,c:"var(--c6)",items:["🕳️ Чёрная дыра","🎭 Маска незнакомца","⌛ Забытое время"]},
 {n:"Divine",ru:"Божественный",w:.0008,v:12500,c:"var(--c7)",items:["☀️ Сердце солнца","👁️ Око вселенной","✨ Первая звезда"]}
];
const ALL=[];R.forEach((r,i)=>r.items.forEach(t=>ALL.push({i,t})));
const $=id=>document.getElementById(id);
const INCOME=3;
let S={coins:30,luck:0,rolls:0,found:{},best:-1},busy=false;
const KEY="gacha-v2";
try{const s=localStorage.getItem(KEY)||localStorage.getItem("gacha-v1");if(s)S=Object.assign(S,JSON.parse(s))}catch(e){}
if(S.best<0)ALL.forEach(a=>{if(S.found[a.t]&&a.i>S.best)S.best=a.i});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e4?(n/1e3).toFixed(1)+"K":Math.floor(n).toString();
const luckCost=()=>Math.floor(60*Math.pow(1.6,S.luck));
const weights=()=>{const m=1+S.luck*.07;return R.map((r,i)=>r.w*Math.pow(m,i))};
const fmtP=p=>p>=1?p.toFixed(1)+"%":p>=.1?p.toFixed(2)+"%":"1 из "+fmt(Math.round(100/p));
function pick(){const w=weights(),t=w.reduce((a,b)=>a+b,0);let x=Math.random()*t;
 for(let i=0;i<w.length;i++){if((x-=w[i])<0)return i}return 0}
function show(i,t,extra){
 const [e,...n]=t.split(" "),o=$("orb");
 o.style.setProperty("--rc",R[i].c);$("em").textContent=e;$("nm").textContent=n.join(" ");
 $("rr").textContent=R[i].n+" · "+R[i].ru+(extra?" · "+extra:"");$("rr").style.color=R[i].c;
 o.classList.remove("reveal");void o.offsetWidth;o.classList.add("reveal");
 if(i>=4){const f=$("flash");f.style.setProperty("--fc",R[i].c);f.classList.remove("go");void f.offsetWidth;f.classList.add("go")}
}
function roll(n){
 const cost=10*n;if(busy||S.coins<cost)return;S.coins-=cost;busy=true;
 let best=-1,bi=null,gain=0,lines=[];
 for(let k=0;k<n;k++){
  const i=pick(),its=R[i].items,t=its[Math.floor(Math.random()*its.length)];
  S.rolls++;S.found[t]=(S.found[t]||0)+1;gain+=R[i].v;
  if(i>best){best=i;bi=t}if(i>S.best)S.best=i;
  if(i>=3)lines.push(`<div style="color:${R[i].c}">${R[i].ru}: ${t}</div>`);
 }
 S.coins+=gain;render();save();
 const o=$("orb");o.classList.add("charge");$("nm").textContent="…";$("rr").textContent="";
 setTimeout(()=>{o.classList.remove("charge");show(best,bi,"+"+fmt(gain));
  if(lines.length)$("log").innerHTML=lines.join("")+$("log").innerHTML;
  busy=false;render()},n>1?650:450);
}
function render(){
 $("coins").textContent=fmt(S.coins);$("lucklv").textContent=S.luck;$("rolls").textContent=S.rolls;
 const b=$("best");if(S.best>=0){b.textContent=R[S.best].n+" · "+R[S.best].ru;b.style.color=R[S.best].c}else{b.textContent="—";b.style.color=""}
 $("r1").disabled=busy||S.coins<10;$("r10").disabled=busy||S.coins<100;
 const lc=luckCost();$("luck").textContent=`Прокачать удачу до ${S.luck+1} · ${fmt(lc)}`;$("luck").disabled=S.coins<lc;
 const w=weights(),t=w.reduce((a,b)=>a+b,0);
 $("odds").innerHTML=R.map((r,i)=>{const p=w[i]/t*100,bw=Math.max(2,Math.min(100,Math.log10(p*1e4+1)/6*100));
  return `<div class="od"><span style="color:${r.c};font-weight:700">${r.n}</span><span class="bar"><i style="width:${bw}%;background:${r.c}"></i></span><span>${fmtP(p)}</span></div>`}).join("");
 const got=ALL.filter(a=>S.found[a.t]).length;$("colcount").textContent=`${got}/${ALL.length}`;
 $("col").innerHTML=ALL.map(a=>{const n=S.found[a.t]||0,e=a.t.split(" ")[0];
  return `<div class="glass it ${n?"":"off"}" style="${n?"border-color:"+R[a.i].c:""}"><div class="e">${n?e:"❔"}</div>${n?a.t.slice(e.length+1):"???"}<div style="color:${R[a.i].c};font-size:12px">${R[a.i].ru}${n?" ×"+n:""}</div></div>`}).join("");
}
$("r1").onclick=()=>roll(1);$("r10").onclick=()=>roll(10);
$("luck").onclick=()=>{const c=luckCost();if(S.coins>=c){S.coins-=c;S.luck++;render();save()}};
$("reset").onclick=()=>{if(confirm("Удалить весь прогресс?")){S={coins:30,luck:0,rolls:0,found:{},best:-1};$("log").innerHTML="";save();render()}};
const ADMIN_PASS="admin123";
$("a_rar").innerHTML=R.map((r,i)=>`<option value="${i}">${r.n}</option>`).join("");
$("adm").onclick=()=>{const p=$("admp");if(p.style.display!=="none"){p.style.display="none";return}
 if(prompt("Пароль админа")===ADMIN_PASS)p.style.display="block"};
$("a_give").onclick=()=>{S.coins+=Math.max(0,+$("a_coins").value||0);render();save()};
$("a_setluck").onclick=()=>{S.luck=Math.max(0,Math.floor(+$("a_luck").value||0));render();save()};
$("a_item").onclick=()=>{const i=+$("a_rar").value,its=R[i].items,t=its[Math.floor(Math.random()*its.length)];
 S.found[t]=(S.found[t]||0)+1;show(i,t,"выдано админом");render();save()};
$("a_all").onclick=()=>{ALL.forEach(a=>{if(!S.found[a.t])S.found[a.t]=1});render();save()};
setInterval(()=>{S.coins+=INCOME;render();save()},1000);
render();
</script>
</body>
</html>
